
name: Spring Boot Employee-1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-employee-jar
          path: target/*.jar
          if-no-files-found: error



  job2_download:
    name: Job 2 - Download JAR
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-employee-jar
          path: downloaded-jar

      - name: Verify downloaded JAR
        run: |
          echo "Downloaded JAR files:"
          ls -lh downloaded-jar/

  job3_deploy:
    name: Job 3 - Deploy Application
    runs-on: ubuntu-latest
    needs: job2_download

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-employee-jar
          path: downloaded-jar

      - name: Prepare deployment package
        run: |
          mkdir -p deployment
          cp downloaded-jar/*.jar deployment/
          echo "Deployment package prepared successfully"
          ls -lh deployment/

      - name: Deployment status
        run: echo "Spring Boot Employee deployment completed successfully!"


  job4_verify:
    name: Job 4 - Verify Application
    runs-on: ubuntu-latest
    needs: job3_deploy

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-employee-jar
          path: downloaded-jar

      - name: Start Spring Boot application
        run: |
          JAR_FILE=$(find downloaded-jar -name "*.jar" | head -n 1)
          java -jar "$JAR_FILE" > app.log 2>&1 &
          echo $! > app.pid

      - name: Check application process
        run: |
          sleep 10
          if kill -0 $(cat app.pid); then
            echo "Application started successfully"
          else
            cat app.log
            exit 1
          fi

  job5_docker_publish:
    name: Job 5 - Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, job4_verify]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-employee-jar
          path: target

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ttgupta/employee-management:latest

